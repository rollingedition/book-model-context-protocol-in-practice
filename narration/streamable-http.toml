# Spoken descriptions for chapter 6, Serve over Streamable HTTP: what each example does and what its output shows,
# and what the chapter's table compares.

[examples.serve-on-loopback]
say = "The code takes chapter 3's five tools, unchanged, and serves them over Streamable HTTP in a process of their own, on a free loopback port. A client given only the endpoint's address connects to {{out:serve-on-loopback:endpoint host}} at the path {{out:serve-on-loopback:endpoint path}}, settles on revision {{out:serve-on-loopback:protocol revision}}, and finds {{out:serve-on-loopback:tools}} tools on the server {{out:serve-on-loopback:server}}. It looks up order O-1873, which is {{out:serve-on-loopback:O-1873 status}}."

[examples.trace-an-http-exchange]
say = "The code wraps the shop's server in a recorder that logs every HTTP exchange, and calls get order status once with the SDK's client. The client sends three posts: {{out:trace-an-http-exchange:POSTs}}. The tool call carries the protocol version header, {{out:trace-an-http-exchange:request mcp-protocol-version}}, the method header, {{out:trace-an-http-exchange:request mcp-method}}, and the name header, {{out:trace-an-http-exchange:request mcp-name}}, and its answer is {{out:trace-an-http-exchange:response status}} as {{out:trace-an-http-exchange:response content-type}}, with no session header. Then the code sends a tool call whose name header says check stock while its body names get order status, and gets {{out:trace-an-http-exchange:mismatched Mcp-Name status}} with error {{out:trace-an-http-exchange:mismatched Mcp-Name error}}. A GET request gets {{out:trace-an-http-exchange:GET status}}, with an allow header of {{out:trace-an-http-exchange:GET allow}}."

[examples.progress-on-stock-recount]
say = "The code defines recount stock, which asks the shop's API to recount each of the shop's products in turn and reports progress after each one. It serves the tool twice and calls it once on each, with a progress callback. With the SDK's default, the response is {{out:progress-on-stock-recount:sse content-type}}, the client receives {{out:progress-on-stock-recount:sse progress reports}} reports, and the last is {{out:progress-on-stock-recount:sse last report}}. With JSON responses only, the response is {{out:progress-on-stock-recount:json content-type}} and {{out:progress-on-stock-recount:json progress reports}} reports arrive, although the recount still counts {{out:progress-on-stock-recount:json units counted}} units."

[examples.cancel-the-stock-recount]
say = "The code defines recount stock again, now recording how each run ends, and catches the cancellation only to note how far it got before raising it again. The client cancels the call when the fifth progress report arrives. The server says it was {{out:cancel-the-stock-recount:server saw}}, after asking the API for {{out:cancel-the-stock-recount:recounts asked of the API}} recounts. The recorder shows two posts, {{out:cancel-the-stock-recount:POSTs}}, so no cancellation message crossed the wire. The tool call's stream was {{out:cancel-the-stock-recount:tools/call stream}}, and it carried {{out:cancel-the-stock-recount:tools/call messages}}."

[examples.two-replicas-one-client]
say = "The code starts two replicas of chapter 5's refund server, each a process of its own, with one shop API behind both, and connects one client to each. Each time, it reads order O-1873 from both replicas, quotes a refund for order O-2289 on replica a, which asks for confirmation, and sends the retry with the answer to replica b. It does this three times. With each replica making its own key, the retry fails with {{out:two-replicas-one-client:own keys retry on b}}. With one shared key, the retry passes the SDK but fails inside the tool, because replica b has never seen the quote. With the shared key and a shared store for quotes and answers, the retry on replica b releases the refund, whose status becomes {{out:two-replicas-one-client:shared store retry on b}}, and the same answer sent again to replica a is refused, because the refund was already confirmed."

[examples.reject-a-foreign-origin]
say = "The code serves the shop's server with the SDK's loopback default and sends it a tools list request four ways. With no Origin header it gets {{out:reject-a-foreign-origin:no Origin}}, with the server's own origin {{out:reject-a-foreign-origin:own Origin}}, with an origin at attacker dot example {{out:reject-a-foreign-origin:foreign Origin}}, and with a Host header of fernhill dot example {{out:reject-a-foreign-origin:foreign Host}}. Then it builds the same app with its host set to zero dot zero dot zero dot zero, still listening only on loopback, and the foreign origin gets {{out:reject-a-foreign-origin:0.0.0.0 app, foreign Origin}}, and the foreign host {{out:reject-a-foreign-origin:0.0.0.0 app, foreign Host}}."

[[tables]]
section = "stdio-or-http"
starts = "| | stdio | Streamable HTTP |"
say = "A table comparing standard I O with Streamable HTTP. Over standard I O, each host starts its own server, only that host can reach it, a client cancels with a cancelled notification, logs go to standard error, credentials come from the host's environment, and it scales by one process per host. Over Streamable HTTP, you start the server once for many hosts, anything that reaches its address can call it, a client cancels by closing the response stream, logs go to the server's own logs, credentials are OAuth access tokens, and it scales by replicas behind a load balancer."
