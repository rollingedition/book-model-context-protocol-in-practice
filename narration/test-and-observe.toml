# Spoken descriptions for chapter 11, Test a server and watch it run: what each example does and what its output
# shows.

[examples.test-tools-in-memory]
say = "The file is a pie test module, and run as a script it runs its own tests and prints one line for each. Three tests connect the S D K's client to the shop's server in memory, with the shop's A P I on loopback: an order's status comes back as structured fields, an unknown order comes back as a tool error that names find orders, and an order I D in the wrong form is refused with an error that names the order I D field and pydantic's pattern check. The fourth serves the same tools over Streamable HTTP on loopback and sends a tool call whose M C P name header names a different tool from its body, and checks for status 400 and the JSON-RPC error -32020. The run reports {{out:test-tools-in-memory:tests passed}} tests passed."

[examples.schema-change-breaks-a-client]
say = "The code connects a client to release 1 of the shop's server in memory and lists the tools; the tool list's cache hint is {{out:schema-change-breaks-a-client:release 1's tools/list cache hint}}. While the client stays connected, it swaps check stock for release 2's version, which renames each warehouse's on hand field to count. The client's next call fails in the client: {{out:schema-change-breaks-a-client:client that listed before the release}}. After the client lists the tools again, the call comes back as a {{out:schema-change-breaks-a-client:client after listing again}}. Then come the two contract checks. The code picks the validator by the dialect release 1's schema declares, with 2020-12 as the default, and gets {{out:schema-change-breaks-a-client:validator for release 1's schema}}. The schema diff reports {{out:schema-change-breaks-a-client:contract check}}, and validating release 2's result against release 1's schema fails with: {{out:schema-change-breaks-a-client:release 2's result against release 1's schema}}."

[examples.replay-ticket-runs]
say = "The code replays chapter 10's queue run through the support host, with the model's replies from the ticket runs recording, and checks each final reply against the calls the host made. It replays {{out:replay-ticket-runs:tickets replayed}} tickets. Ticket T-0009's tools are {{out:replay-ticket-runs:T-0009 tools}}. The host issued {{out:replay-ticket-runs:refunds issued}} refunds, but {{out:replay-ticket-runs:replies that promise a refund}} replies promise one, and {{out:replay-ticket-runs:of which no call made}} of them have no refund behind them: {{out:replay-ticket-runs:issue_refund tickets flagged}} of the tickets asking for a refund, and {{out:replay-ticket-runs:quote_refund tickets flagged}} of the tickets asking what a refund would be. Then it adds one sentence to quote refund's description and replays the first ticket, which stops with a recording mismatch."

[examples.trace-a-tool-call]
say = "The code installs open telemetry's S D K with an exporter that keeps finished spans in memory. It serves the shop's tools over Streamable HTTP on loopback, calls find orders, and calls quote refund for an order that doesn't exist. Over HTTP each request makes a client span named M C P send, then the method, and a server span named after the method and the tool, and the server's span for find orders has the client's span as its parent. Its attributes give the method, {{out:trace-a-tool-call:attribute mcp.method.name}}, the operation, {{out:trace-a-tool-call:attribute gen_ai.operation.name}}, the tool, {{out:trace-a-tool-call:attribute gen_ai.tool.name}}, and the protocol revision. The failed quote's span has status {{out:trace-a-tool-call:tool error span status}} and an error type of {{out:trace-a-tool-call:tool error span error.type}}. In memory the code makes the same call twice, the second time inside a test span of its own. There are no client spans, and the two server spans' parents are none, then the test span. Last, the pinned semantic conventions package does not list server discover."

[examples.tool-choice-accuracy]
say = "The code replays chapter 10's queue run and scores each ticket's first tool call against the tool the ticket is tagged with, counting quote refund as the right start for a refund. The first tool was right for {{out:tool-choice-accuracy:first tool right}} tickets, a top-1 accuracy of {{out:tool-choice-accuracy:top-1 accuracy}}. By tag: check stock {{out:tool-choice-accuracy:expected shop.check_stock}}, find orders {{out:tool-choice-accuracy:expected shop.find_orders}}, get order status {{out:tool-choice-accuracy:expected shop.get_order_status}}, and quote refund {{out:tool-choice-accuracy:expected shop.quote_refund}}. Refund tickets that went to get order status: {{out:tool-choice-accuracy:expected shop.quote_refund, called shop.get_order_status}}; status questions that went to the partner's track parcel: {{out:tool-choice-accuracy:expected shop.get_order_status, called partner.track_parcel}}; refund tickets that went to find orders: {{out:tool-choice-accuracy:expected shop.quote_refund, called shop.find_orders}}. Of the right first calls that name an order, the order I D matches the ticket's text in {{out:tool-choice-accuracy:right tool, order ID as the ticket wrote it}}, and the order the customer meant in {{out:tool-choice-accuracy:right tool, order the customer meant}}. {{out:tool-choice-accuracy:tickets with a mistyped order ID}} tickets have a mistyped order I D; {{out:tool-choice-accuracy:of which the right tool was called}} of them reached the right tool, and T-0042 went first to {{out:tool-choice-accuracy:mistyped T-0042, first tool}}. The smallest tag has {{out:tool-choice-accuracy:smallest expected-tool group, tickets}} tickets. Last, the recorded model, {{out:tool-choice-accuracy:recorded model}}, and its quantization, {{out:tool-choice-accuracy:recorded quantization}}."

[examples.deprecate-a-tool]
say = "The code serves the shop's tools over Streamable HTTP on loopback, with a one-minute time to live on the tool list, and connects two clients that both list the tools: one listens for list changes, and one only caches. Release 1 lists {{out:deprecate-a-tool:release 1}}. Release 2 adds find orders v two, marks find orders as deprecated in its description, and publishes the change. The listening client receives a tools list changed event, and its next listing shows both tools. The caching client still shows release 1's five tools, and its call to find orders during the window comes back as a {{out:deprecate-a-tool:find_orders during the window}}. Release 3 replaces find orders with a function that raises a tool error, and the caching client's next call reads: {{out:deprecate-a-tool:find_orders after the window}}"

[terms]
"0.66b2" = "zero point sixty-six beta two"
