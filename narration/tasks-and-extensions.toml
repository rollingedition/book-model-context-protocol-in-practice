# Spoken descriptions for chapter 7, Run long work as tasks: what each example does and what its output shows, and
# what the chapter's table compares.

[examples.declare-the-tasks-extension]
say = "The code defines the shop's server with the book's Tasks extension, set to answer every call to restock report with a task, and a restock report tool that recounts every product and lists those below a threshold. It serves the server over Streamable HTTP on loopback, beside the shop's API. One client, with the book's Tasks client extension, connects at revision {{out:declare-the-tasks-extension:protocol revision}} and lists the tools. The server declares {{out:declare-the-tasks-extension:server declares}}, and the client declares {{out:declare-the-tasks-extension:client declares}} in its request's metadata: the extension's identifier with empty settings, on both sides. A second client, without the extension, calls restock report and gets JSON R P C error {{out:declare-the-tasks-extension:client without it}}, whose data names what it lacked: {{out:declare-the-tasks-extension:required}}. Its tasks get is refused too, with error {{out:declare-the-tasks-extension:tasks/get without it}}."

[examples.start-a-restock-report]
say = "The code loads the server from the previous example, connects a client with the Tasks client extension, and calls restock report in a way that hands back the task handle instead of finishing it. Then it sends one tasks get at once, and reads the trace of the HTTP exchanges. The handle's result type is {{out:start-a-restock-report:result type}}, and its fields are {{out:start-a-restock-report:handle fields}}. Its status is {{out:start-a-restock-report:status}}, it was created at {{out:start-a-restock-report:created at}} on the fake clock, its time to live is {{out:start-a-restock-report:ttl ms}} milliseconds, and its poll interval {{out:start-a-restock-report:poll interval ms}} milliseconds. The task I D is {{out:start-a-restock-report:task id length}} characters long. The tasks get sent straight after finds the task {{out:start-a-restock-report:tasks/get straight after}}, and the example asserts that the M C P name header on the tasks get matches the task I D."

[examples.poll-the-restock-report]
say = "The code loads the same server and connects a client whose Tasks client extension keeps every tasks get reply. It calls restock report with a threshold of 30 units, and the extension polls until the task ends. The statuses seen were {{out:poll-the-restock-report:statuses}}. Two asserts check that the report was still working on more than one poll, and that its status messages only counted up. The last message reads: {{out:poll-the-restock-report:last message}}. The call returns a {{out:poll-the-restock-report:result type}}: {{out:poll-the-restock-report:skus recounted}} products recounted, {{out:poll-the-restock-report:to reorder}} to reorder, the first being {{out:poll-the-restock-report:first to reorder}}."

[examples.expire-a-task]
say = "The code defines the shop's server with a fake clock and a time to live of one minute, and gives each report a gate that lets it start a product only when the code allows one. It starts one restock report, which it never allows a product, whose time to live is {{out:expire-a-task:first, ttl ms}} milliseconds, and polls it: {{out:expire-a-task:first, first poll}}. It moves the fake clock on 61 seconds and polls again, and gets {{out:expire-a-task:first, 61 s later}}. Then it starts a second report, allows it one product, and waits for its first status message: {{out:expire-a-task:second, before cancel}}. It cancels the task, and the acknowledgement holds, besides the S D K's metadata stamp, only {{out:expire-a-task:cancel acknowledged, besides _meta}}. A poll straight after finds the task still {{out:expire-a-task:second, right after}}. The code allows one more product, and polling until the task ends gives {{out:expire-a-task:second, finally}}."

[[tables]]
section = "task-or-call"
starts = "| | Plain call |"
say = "A table comparing a plain call, a call that streams progress, and a task. A plain call typically lasts seconds, progress up to a few minutes, and a task minutes or more. A plain call and progress both need the connection to stay open; a task doesn't. While waiting, a plain call's caller sees nothing, progress shows progress and a total, and a task shows a status message. Only a task survives a client restart, if the client stored its I D. And only a task needs an extension, on both sides."
