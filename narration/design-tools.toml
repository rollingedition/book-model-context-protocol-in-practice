# Spoken descriptions for chapter 3, Design tools a model can use: what each example does and what its output shows.

[examples.tools-from-endpoints]
say = "The code prints two tool lists for the shop's API: five tools generated one per endpoint, and the shop's five task tools, each with the arguments it requires. The endpoint tool for listing orders requires nothing, and the one for refunds requires an order and an amount. It also prints the protocol revision the client and server agreed on. Then it handles ticket T-0024 both ways. Posting the whole order's total to the refund endpoint is accepted with status {{out:tools-from-endpoints:post_refunds status}}, for {{out:tools-from-endpoints:post_refunds amount}}. Asking quote refund for the muffin tray's line gives {{out:tools-from-endpoints:quote_refund amount}}, and within limit is {{out:tools-from-endpoints:quote_refund within limit}}."

[examples.vague-description-wrong-tool]
say = "The code lists the shop's five tools and shows them to the model with three sets of descriptions, vague, draft and revised, for eight tickets, replaying the recorded reply for each, and prints the temperature the replies were sampled at. It prints one line for each ticket where all three sets chose the right first tool, and for the other tickets, the tool each set chose and, for the revised set, the SKU the model sent beside the SKUs on the order. Four order tickets and the stock ticket got the right tool from all three sets. For the three refund tickets, the vague and draft sets chose another tool, and the revised set chose quote refund, each time with a SKU that isn't on the order. The vague set chose the right first tool for {{out:vague-description-wrong-tool:vague right}} tickets, the draft for {{out:vague-description-wrong-tool:draft right}}, and the revised set for {{out:vague-description-wrong-tool:revised right}}."

[examples.reject-bad-arguments]
say = "The code lists the input schema of find orders: a pattern for the customer ID, an enum of the order statuses, a date, and a bounded limit. Then it calls the tool with a bad customer ID, status and limit at once, and gets one failed result whose text names all three arguments, the rule each broke and the value sent. A limit sent as the string five is accepted, and returns {{out:reject-bad-arguments:string limit orders}} orders. The date the model sent for ticket T-0013, in the wrong year, passes validation and returns {{out:reject-bad-arguments:since 2023-06-12 orders}} orders, against {{out:reject-bad-arguments:since 2026-06-12 orders}} for the shop's year."

[examples.refund-quote-structured]
say = "The code calls quote refund for order O-2289 and prints the fields its output schema requires, the structured content it returned with the random quote ID hidden, the quote's lifetime in minutes, its amount, {{out:refund-quote-structured:amount}}, and within limit, {{out:refund-quote-structured:within limit}}. A check that the text block holds the same JSON prints {{out:refund-quote-structured:text block is the same JSON}}. Then it defines a second server whose one tool returns the amount as a bare string, and shows that the SDK publishes an object schema for it and wraps the string in an object under the key result."

[examples.tool-error-versus-protocol-error]
say = "The code makes five failing calls and prints which path each takes. Ticket T-0006's recorded call, with a SKU the model made up, comes back as a failed tool result whose text lists the order's real SKU. A call to issue refund with a quote the server never issued comes back as a failed result that says to call quote refund. A call to a tool that doesn't exist also comes back as a failed result, not a protocol error. A server with the wrong API key answers with a JSON R P C error, with an internal error code and a message saying the server needs reconfiguring, that only the host sees. And after the shop's API stops, the model gets only the generic message: {{out:tool-error-versus-protocol-error:API down says}}."

[examples.annotate-the-refund-tool]
say = "The code lists the shop's tools and the endpoint tool for refunds, fills in the specification's default for every missing hint, and prints what a host should assume about each tool, and whether a host that asks consent for anything not read-only asks before it. The four reading tools are read-only and need no consent. Issue refund is idempotent, and needs consent. The unannotated endpoint tool is assumed destructive and open-world, and needs consent too. Then two calls to issue refund with one quote return the same refund, {{out:annotate-the-refund-tool:issue_refund first refund}} both times, while two identical posts to the API create two refunds, {{out:annotate-the-refund-tool:post_refunds first refund}} and {{out:annotate-the-refund-tool:post_refunds second refund}}."

[examples.tool-list-size]
say = "The code lists the shop's tools, renders them as the host's prompt does, and adds up their bytes, and their tokens as the recording script counted them with the model's tokenizer, stopping if any tool changed since. The revised tools take {{out:tool-list-size:revised prompt tokens}} tokens, about {{out:tool-list-size:revised tokens per tool}} a tool. With vague descriptions they take {{out:tool-list-size:vague prompt tokens}}, and the endpoint tools take {{out:tool-list-size:endpoint prompt tokens}}. Twenty such tools would take about {{out:tool-list-size:20 such tools tokens}}. The rest of the host's prompt takes {{out:tool-list-size:prompt without tools tokens}} tokens, of a {{out:tool-list-size:recording context tokens}}-token context. The full tools list result is {{out:tool-list-size:tools/list result bytes}} bytes."
