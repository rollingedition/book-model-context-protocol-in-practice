# Spoken descriptions for chapter 4, Serve data as resources and prompts: what each example does and what its
# output shows, and what the chapter's table compares.

[examples.list-policy-resources]
say = "The code defines the shop-support server with six static resources, one for each of the shop's policies, each read from its Markdown file, with a title, a description and annotations. The refund policy gets priority one, the others one half. The server marks its resource list and its reads public for an hour. A client launched over standard I O agrees on revision {{out:list-policy-resources:protocol revision}}, lists {{out:list-policy-resources:resources}} resources, and sees the list's cache scope, {{out:list-policy-resources:list cache scope}}, and its lifetime, {{out:list-policy-resources:list ttl ms}} milliseconds. It then reads the refund policy, which comes back as {{out:list-policy-resources:mime type}} text under the same public scope."

[examples.order-resource-template]
say = "The code defines a resource template for the shop's orders, whose function calls the shop's API for one order and raises resource not found when the ID isn't in the shop's format or the API answers four oh four. A client lists the template, {{out:order-resource-template:template}}, and reads order O-2476, which is {{out:order-resource-template:O-2476 status}}, with the cache scope {{out:order-resource-template:read cache scope}}. Reading order O-7144, which doesn't exist, fails with code {{out:order-resource-template:unknown order code}} and the handler's message, with the URI in the error's data. The ID 2476, without its prefix, fails with code {{out:order-resource-template:malformed code}} and the format check's message. A URI whose order ID is an encoded path that climbs two levels up fails with code {{out:order-resource-template:traversal code}}, but with the SDK's own message, because the SDK refused it before the function ran."

[examples.complete-order-ids]
say = "The code defines the order template and a completion handler, both scoped to the customer the server acts for, which the host passes in the environment: customer C-0127. The handler asks the shop's API for that customer's orders, at most a hundred, and keeps those that start with what the user typed. It reports a total only when the API returned every order, and otherwise says there are more. The shop holds {{out:complete-order-ids:shop orders starting O-2}} orders whose IDs start with O-2, but typing O-2 offers this customer only {{out:complete-order-ids:O-2 offers}}, and typing o-24 in lower case offers {{out:complete-order-ids:o-24 offers}}. Reading another customer's order, O-1767, and an order that doesn't exist, O-7144, both fail with the same code and the same message, apart from the ID. The example also prints the most orders any one customer has, {{out:complete-order-ids:most orders for one customer}}, which is within the API's limit."

[examples.stock-resource-changes]
say = "The code serves each product's stock counts as a resource, kept in the server's memory, and a tool, set on hand, that replaces a count and publishes an update for that product. A client opens subscriptions listen for product KG-1018 and for KG-9999, which doesn't exist, and the server honours both: {{out:stock-resource-changes:honoured}}. KG-1018 starts at {{out:stock-resource-changes:before}}. The client records a recount of another product, then of KG-1018, and the first event it receives names {{out:stock-resource-changes:first event}}. Reading again gives {{out:stock-resource-changes:after}}. The client closes the stream, records another recount while nobody listens, and opens a new stream: in a second of waiting, {{out:stock-resource-changes:events after re-listening}} events arrive, and only a fresh read shows the change, {{out:stock-resource-changes:re-read}}."

[examples.refund-review-prompt]
say = "The code defines a prompt, review refund, with two arguments, an order ID and an amount. It checks both formats, looks the order up through the shop's API, and returns two user messages: the refund policy as an embedded resource, then the order with the review's questions. A client fills it in for order O-1145 and an amount of 343.49. Message one is {{out:refund-review-prompt:message 1}}, and message two is {{out:refund-review-prompt:message 2}}. A path given as the order ID fails with the prompt's own message. A missing amount and a misspelled prompt name both fail with a different code and one generic message from the SDK, which hides the SDK's own."
