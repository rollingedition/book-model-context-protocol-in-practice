# Spoken descriptions for chapter 2, What MCP adds to an API: what each example does and what its output shows.

[examples.list-what-the-server-offers]
say = "The code defines the shop's chapter 2 server, shop-support, with three things: the get order status tool from chapter 1, the shop's refund policy as a resource, and a prompt called review refund that takes an order ID. Run without arguments, the file launches itself as a server over standard I O and asks it what it offers. The server introduces itself as {{out:list-what-the-server-offers:server}}, supports revision {{out:list-what-the-server-offers:supported versions}}, and declares the capabilities {{out:list-what-the-server-offers:capabilities}}. Its lists hold one tool, one resource, the refund policy's address, and one prompt."

[examples.three-primitives-side-by-side]
say = "The code launches shop-support and uses each of its three primitives once, as a host would. It calls the get order status tool for order O-2476, which comes back without an error and with the status {{out:three-primitives-side-by-side:tool says order status}}. It reads the refund policy resource, which is Markdown text starting with its title. And it gets the review refund prompt for the same order: the prompt takes one argument, the order ID, which is required, and returns {{out:three-primitives-side-by-side:prompt messages}} message from the {{out:three-primitives-side-by-side:prompt role}}, which tells the model to look up the order and check it against the refund policy."

[examples.request-meta-on-the-wire]
say = "The code calls get order status through a relay that logs every line on the wire, adding one key of the shop's own, a request I D, to the request's meta. It prints every key in it: the shop's request I D, then the protocol version, {{out:request-meta-on-the-wire:request io.modelcontextprotocol/protocolVersion}}, the client's name and version, and the client's capabilities, which are empty. The result's meta carries the server's name and version. The request's meta takes {{out:request-meta-on-the-wire:request _meta bytes}} bytes on the wire, and the result's {{out:request-meta-on-the-wire:result _meta bytes}}. Then the code writes a request by hand that leaves out the client's capabilities, and the server rejects it with error code {{out:request-meta-on-the-wire:without capabilities, error code}}, naming the missing key."

[examples.unsupported-version-error]
say = "The code first asks the SDK's client to connect with a made-up revision, and the client refuses with a {{out:unsupported-version-error:client refuses}} before sending anything. So it starts shop-support directly and writes a tools list request by hand, asking for the made-up revision. The server answers with error code {{out:unsupported-version-error:error code}}, unsupported protocol version, and says it supports {{out:unsupported-version-error:server supports}}. The code picks the newest version both sides know, {{out:unsupported-version-error:retry with}}, retries on the same process, and gets the tool list back."

[examples.cache-the-tool-list]
say = "The code lists the tools twice from two servers and counts, in a wire log, how many tools list requests reach each one. Chapter 1's shop-orders server sets no cache hint, so its tool list is stale at once and both calls reach it: {{out:cache-the-tool-list:shop-orders tools/list sent for two calls}} requests. shop-support marks its tool list fresh for five minutes and public, so the client's cache answers the second call and only {{out:cache-the-tool-list:shop-support tools/list sent for two calls}} request reaches the server. When the second call bypasses the cache, both reach it again: {{out:cache-the-tool-list:shop-support tools/list sent when the second call bypasses}}."

[examples.api-call-versus-tool-call]
say = "The code runs everything in one process on loopback, over plain HTTP, and puts a byte-counting relay in front of each server. It fetches order O-2476 from the shop's API once: {{out:api-call-versus-tool-call:api call round trips}} round trip and {{out:api-call-versus-tool-call:api call bytes}} bytes. Then it fetches the same order through shop-support's get order status tool over Streamable HTTP: also one round trip, but {{out:api-call-versus-tool-call:mcp tool call bytes}} bytes, {{out:api-call-versus-tool-call:tool call bytes per api call byte}} times as many. Opening a client and listing the tools costs {{out:api-call-versus-tool-call:mcp auto setup bytes}} bytes in {{out:api-call-versus-tool-call:mcp auto setup request count}} requests in auto mode, and {{out:api-call-versus-tool-call:mcp pinned setup bytes}} bytes in {{out:api-call-versus-tool-call:mcp pinned setup request count}} with the version pinned. The tool call is made with the version pinned."
