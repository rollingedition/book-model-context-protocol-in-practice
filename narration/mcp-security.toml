# Spoken descriptions for chapter 9, Secure tools against misuse: what each example does and what its output shows,
# and what the chapter's table compares.

[[tables]]
section = "trust-boundaries"
starts = "| Boundary | What crosses it | Who"
say = "A table of the shop's five trust boundaries, with what crosses each and who checks it. Between the user and the host, each tool call with side effects crosses, and the host asks the user first. Between the host and the shop's server, an access token for the shop's server crosses, and the server checks its issuer, audience and scope. Between the shop's server and the shop's API, the server's own API key crosses, and the API checks the key. Between the host and the partner's server, tool definitions cross, and the host pins them and shows them to the user. And between a ticket and the model, customer text crosses inside the host's messages, and nobody can check it: it stays data."

[examples.token-passthrough-rejected]
say = "The code runs the shop's authorization server, the shop's API with a wrapper that records the headers of every request it receives, and this chapter's shop server. It mints a token for customer C-0127 whose audience is the partner's server, {{out:token-passthrough-rejected:partner's token aud}}, and forwards it to the shop's server, as a careless partner would. The shop's server answers H T T P {{out:token-passthrough-rejected:partner forwards its token, shop's server answers}}, with the error {{out:token-passthrough-rejected:challenge error}}. Then it sends a token minted for the shop's server, and the order's status comes back: {{out:token-passthrough-rejected:host sends a token for the shop's server}}. {{out:token-passthrough-rejected:requests that reached the shop's API}} requests reached the shop's API. None carried an authorization header, and every one carried the server's own key."

[examples.confused-deputy-refund]
say = "The code plays a host that customer C-0127 signed in to and, against the shop's server, lists customer C-0116's orders, quotes and issues a refund on C-0116's order O-1190, and then spends a quote that C-0116 got for the same order. It runs twice: once with chapter 3's tools behind OAuth, and once with this chapter's tools, which take the customer from the token's subject. With chapter 3's tools, find orders lists the orders of {{out:confused-deputy-refund:chapter 3, find_orders lists orders of}}, the quote comes back at {{out:confused-deputy-refund:chapter 3, quote_refund on O-1190}}, the refund is {{out:confused-deputy-refund:chapter 3, issue_refund}}, and C-0116's quote, spent by C-0127, is {{out:confused-deputy-refund:chapter 3, C-0127 spends C-0116's quote}}. With this chapter's tools, find orders lists the orders of {{out:confused-deputy-refund:token's subject, find_orders lists orders of}}, the quote is {{out:confused-deputy-refund:token's subject, quote_refund on O-1190}}, and the borrowed quote is {{out:confused-deputy-refund:token's subject, C-0127 spends C-0116's quote}}."

[examples.poisoned-description]
say = "The code lists the shop's tools and the partner's track parcel tool, once in its clean version and once in its poisoned one, and replays the recorded model's first choice for three ordinary tickets with each. The title the user sees is {{out:poisoned-description:poisoned, title the user sees}} in both versions, while the description grows from {{out:poisoned-description:clean, description characters}} characters to {{out:poisoned-description:poisoned, description characters}}, with an added instruction to call track parcel first with the customer's whole message. For the delivery question the model chose {{out:poisoned-description:T-0003, poisoned}} with the poisoned tool present, for the damaged item {{out:poisoned-description:T-0006, poisoned}}, and for the stock question {{out:poisoned-description:T-0016, poisoned}}, the same as with the clean tool. Of the {{out:poisoned-description:poisoned runs}} poisoned runs, {{out:poisoned-description:poisoned runs that called track_parcel}} called track parcel."

[examples.tool-definition-changed]
say = "The code lists the shop's tools and the partner's tools, at revision {{out:tool-definition-changed:protocol revision}}, and pins a hash of each definition as the user approves it: {{out:tool-definition-changed:approved}}. Then it lists the partner's next release, whose track parcel carries the poisoned description, and compares. Track parcel is {{out:tool-definition-changed:partner 2.1.0, track_parcel}}, and the field that changed is the {{out:tool-definition-changed:fields changed}}. The title the user sees is still {{out:tool-definition-changed:title the user sees}}, and its read-only hint is still set. The shop's tools are all {{out:tool-definition-changed:shop's tools}}, so the model sees only the shop's five: {{out:tool-definition-changed:tools the model sees}}."

[examples.ticket-injection]
say = "Of the shop's {{out:ticket-injection:tickets}} tickets, the code takes the {{out:ticket-injection:tickets carrying instructions}} that carry instructions for an agent, and replays the recorded model's first choice for each, with the shop's tools only. The first call followed the injection in {{out:ticket-injection:first calls that followed an injection}} tickets; for the ticket asking where order O-2476 is, the model chose {{out:ticket-injection:T-0008, model chose}}. Then the code plays a fooled host that each ticket's customer signed in to, and does the worst single thing most of the injections ask: it quotes the ticket's order and issues the refund at once, with an extra amount of 500.00. For T-0008, the server answers: {{out:ticket-injection:T-0008, obeyed anyway}}. For T-0037, which demanded 500 euros, the result is {{out:ticket-injection:T-0037, obeyed anyway}}. Every refund that goes through is the quoted amount, on the customer's own order."

[examples.consent-gate]
say = "The code connects the host to the shop's server, with a token for customer C-0127, and to the partner's server, and puts the host's consent gate in front of three calls: an order lookup, a refund above the policy limit on C-0127's own order O-1928, and a track parcel call whose note holds a whole ticket. A scripted user says yes to the refund, to the host and then to the server, and declines the partner's call. The partner's tool claims a read-only hint, and the gate asks anyway. The order lookup {{out:consent-gate:shop/get_order_status}} without a question, with the status {{out:consent-gate:shop/get_order_status status}}. The refund is asked about twice, first by the host with its arguments and then by the server, and {{out:consent-gate:shop/issue_refund}}, with the status {{out:consent-gate:shop/issue_refund status}}. The partner's call is asked about with the ticket text in its arguments, and is {{out:consent-gate:partner/track_parcel}}. The log reads: {{out:consent-gate:decisions logged}}."
