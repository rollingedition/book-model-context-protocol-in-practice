# Spoken descriptions for chapter 10, Build a host that works through tickets: what each example does and what its
# output shows.

[examples.connect-two-servers]
say = "The code starts the support host with its two servers: the shop's, over standard I O, under the prefix shop, and the partner's, in-process, under the prefix partner. Each client settles its own revision: the shop's server, {{out:connect-two-servers:shop server}}, on {{out:connect-two-servers:shop protocol revision}}, and the partner's, {{out:connect-two-servers:partner server}}, on {{out:connect-two-servers:partner protocol revision}}. The S D K's client session group, given the same shop server, settles on {{out:connect-two-servers:ClientSessionGroup protocol revision}}. Then the code reconnects to the shop's server through the wire relay, passing the discover result the first client cached and the revision it settled on. The reconnect speaks {{out:connect-two-servers:reconnect protocol revision}}, and it sends no server discover request, which the example asserts. Its first request is {{out:connect-two-servers:reconnect first request}}."

[examples.tool-name-collision]
say = "The code takes the partner's server and adds a second tool, get order status, for the partner's own delivery orders, so that both servers have a tool with that name. It serves that server over standard I O and connects the shop's server and it to the S D K's client session group, which refuses the second one: {{out:tool-name-collision:ClientSessionGroup}} Then it connects both to the support host, which prefixes every name with its own key for the server. The model sees {{out:tool-name-collision:tools the model sees}} tools. shop dot get order status routes to {{out:tool-name-collision:shop.get_order_status routes to}}, partner dot get order status to {{out:tool-name-collision:partner.get_order_status routes to}}, and a bare get order status to {{out:tool-name-collision:get_order_status routes to}}."

[examples.host-answers-elicitation]
say = "The code starts the support host with a scripted lead who accepts the first input request and declines the second. The refund policy's limit is €{{out:host-answers-elicitation:refund policy limit}}. For orders O-1145 and O-2289, both above it, it quotes a refund, such as quote {{out:host-answers-elicitation:O-1145 quote id}} for the first, and calls issue refund through the host, the path a model's call takes. Each time the lead sees that the request comes from {{out:host-answers-elicitation:O-1145 asked by}}, with the server's message, such as: {{out:host-answers-elicitation:O-1145 message}} The form's one field is {{out:host-answers-elicitation:form fields}}. The lead's {{out:host-answers-elicitation:O-1145 lead's answer}} brings the refund back as a {{out:host-answers-elicitation:O-1145 outcome}}. The lead's {{out:host-answers-elicitation:O-2289 lead's answer}} brings back a {{out:host-answers-elicitation:O-2289 outcome}}, and the model would read: {{out:host-answers-elicitation:O-2289 back to the model}} The lead answered {{out:host-answers-elicitation:input requests answered}} input requests; the client allows {{out:host-answers-elicitation:retry rounds allowed per call}} retry rounds per call; and the consent gate asked the user about these calls: {{out:host-answers-elicitation:consent asked for}}."

[examples.attach-a-policy-resource]
say = "The code starts the support host with the shop's server behind the wire relay, and lists the server's {{out:attach-a-policy-resource:policies listed}} policies with their priorities: the refund policy at {{out:attach-a-policy-resource:refund policy priority}}, the others at {{out:attach-a-policy-resource:other policies' priority}}. The host attaches every resource for the assistant at priority {{out:attach-a-policy-resource:attach at priority at least}} or more, which is {{out:attach-a-policy-resource:attached}} alone, then reads that policy a second time. The read's time to live is {{out:attach-a-policy-resource:ttl ms}} milliseconds. The model sees {{out:attach-a-policy-resource:tools the model sees}} tools, and the system prompt for one ticket runs {{out:attach-a-policy-resource:system prompt, characters}} characters, of which the policy is {{out:attach-a-policy-resource:of which the policy}}. The trace shows {{out:attach-a-policy-resource:resources/read sent to the server}} resources read request reaching the server: the second read came from the client's cache."

[examples.work-one-ticket]
say = "The code starts the support host with both servers and the refund policy attached, and works ticket T-0009 with the model's replies replayed from the ticket runs recording. The customer asks what a refund would be on order o7144; the order they mean is {{out:work-one-ticket:order the customer means}}. On turn one the model calls the shop's quote refund for O-7144, with a product code the ticket never gave, and the outcome is a {{out:work-one-ticket:turn 1 outcome}}: the shop has no such order, and find orders lists the customer's orders. On turn two the model calls {{out:work-one-ticket:turn 2 tool}}, with an outcome of {{out:work-one-ticket:turn 2 outcome}}. On turn three it replies: {{out:work-one-ticket:turn 3 reply}} The ticket took {{out:work-one-ticket:model calls}} model calls, of the {{out:work-one-ticket:model calls allowed per ticket}} the host allows, with a timeout of {{out:work-one-ticket:timeout per request, seconds}} seconds per request. Then the code reads the recording's manifest: the model sampled at temperature {{out:work-one-ticket:sampling temperature}} with seed {{out:work-one-ticket:sampling seed}}; the recording has {{out:work-one-ticket:recording batches}} batches, {{out:work-one-ticket:single-ticket batches}} of them for a single ticket; a model call took {{out:work-one-ticket:seconds per model call, mean}} seconds on average, and the longest batch {{out:work-one-ticket:longest batch, minutes}} minutes."

[examples.work-the-ticket-queue]
say = "The code starts the support host with both servers and the refund policy attached, works every ticket in the shop's queue in order with the model's replies replayed, and counts what happened. It worked {{out:work-the-ticket-queue:tickets worked}} tickets with {{out:work-the-ticket-queue:model calls}} model calls and {{out:work-the-ticket-queue:tool calls}} tool calls: {{out:work-the-ticket-queue:outcome result}} results and {{out:work-the-ticket-queue:outcome tool error}} tool errors. The first tool matched the ticket's tag, counting quote refund as the right start for a refund, for {{out:work-the-ticket-queue:first tool as tagged}} tickets, and {{out:work-the-ticket-queue:stopped at the turn limit}} tickets hit the turn limit. Tickets asking for a refund that called issue refund: {{out:work-the-ticket-queue:issue_refund tickets that called issue_refund}}; whose reply promised a refund that never ran: {{out:work-the-ticket-queue:issue_refund tickets promising a refund that never ran}}. Tickets asking for a quote that called it: {{out:work-the-ticket-queue:quote_refund tickets that called issue_refund}}; whose reply promised a refund: {{out:work-the-ticket-queue:quote_refund tickets promising a refund that never ran}}. Refunds issued: {{out:work-the-ticket-queue:refunds issued}}. Consent questions: {{out:work-the-ticket-queue:consent questions}}, for {{out:work-the-ticket-queue:consent asked for}}. Injected tickets that called issue refund: {{out:work-the-ticket-queue:injected tickets that called issue_refund}}. For ticket T-0003 the model called {{out:work-the-ticket-queue:T-0003 tool}} with the tracking number {{out:work-the-ticket-queue:T-0003 tracking number}}. Ticket T-0048's reply reads: {{out:work-the-ticket-queue:T-0048 reply}}"
