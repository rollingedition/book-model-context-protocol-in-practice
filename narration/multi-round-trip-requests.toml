# Spoken descriptions for chapter 5, Ask the user in the middle of a call: what each example does and what its
# output shows, and what the chapter's table compares.

[examples.refund-needs-confirmation]
say = "The code defines the shop's server with chapter 3's tools, and an issue refund tool written the 2025 way: it calls chapter 3's version, and when the shop's API holds the refund, it asks the user with context elicit and waits for the answer. A client with a scripted user, who would release the refund, connects at revision {{out:refund-needs-confirmation:protocol revision}}, quotes order O-2289, and calls issue refund. The call fails with JSON-RPC error {{out:refund-needs-confirmation:error code}}, saying the server can't send an elicitation request because it has no channel back to the client. The scripted user saw {{out:refund-needs-confirmation:questions the user saw}} questions."

[examples.refund-asks-to-confirm]
say = "The code defines the shop's server with chapter 3's tools and a new issue refund. It calls chapter 3's version, and when the shop's API holds the refund, it checks that the client declared form elicitation and returns an input required result: one elicitation request under the key confirm, with a one-field yes-or-no form, and the refund's ID as the request state. On the retry, an accepted answer releases the refund, once only, when the request state names the refund that the quote gives. A client quotes order O-2289 and calls issue refund without answering. The result type is {{out:refund-asks-to-confirm:result type}}, the one input request is {{out:refund-asks-to-confirm:input request confirm}}, and its message reads: {{out:refund-asks-to-confirm:message}} The example asserts that the request state the client received starts with the S D K's sealed token prefix, so the S D K sealed it on its way out."

[examples.refund-confirmed-round-trip]
say = "The code launches the server from the previous example through the book's wire relay. For order O-2289 it calls issue refund, gets the input request, and retries by hand with a scripted yes and the echoed request state. The refund comes back as {{out:refund-confirmed-round-trip:by hand}}. Then, for order O-1145, it calls the S D K's call tool with an elicitation callback, which is asked: {{out:refund-confirmed-round-trip:user was asked}}, answers yes, and gets {{out:refund-confirmed-round-trip:by Client.call_tool}}. The trace shows two requests each time, with different I Ds. By hand: {{out:refund-confirmed-round-trip:by hand, call}}; then {{out:refund-confirmed-round-trip:by hand, retry}}. Through call tool: {{out:refund-confirmed-round-trip:Client.call_tool, call}}; then {{out:refund-confirmed-round-trip:Client.call_tool, retry}}."

[examples.elicit-a-refund-reason]
say = "The code defines a record return tool whose inspection parameter is filled by a resolver. The resolver asks, with a form built from a pydantic model, for the refund policy's reason, whether the item can be restocked, and an optional note of at most two hundred characters. The tool takes all three outcomes and answers each differently. A scripted user accepts, then declines, then cancels. Accept gives: {{out:elicit-a-refund-reason:accept}} Decline gives: {{out:elicit-a-refund-reason:decline}} Cancel gives: {{out:elicit-a-refund-reason:cancel}} The form's fields were {{out:elicit-a-refund-reason:form fields}}, and the required ones {{out:elicit-a-refund-reason:required}}. A client with no elicitation callback gets JSON-RPC error {{out:elicit-a-refund-reason:client without elicitation}} before the tool runs."

[examples.elicit-by-url]
say = "The code defines a pay refund tool that sends the support lead to the payment provider's page to connect their account. It makes a random I D for the flow, carries it in the request state, and puts it at the end of a U R L on the reserved domain pay dot fernhill dot example. The refund it pays is one already released. A set in memory stands in for the provider's record of finished flows. The client drives three calls by hand. The first returns {{out:elicit-by-url:first call}}. After the scripted user accepts, the retry still returns {{out:elicit-by-url:after accept}}, because the lead hasn't signed in. The example then marks the flow finished, as the provider would, and the third call gives {{out:elicit-by-url:after sign-in}}"

[examples.tampered-round-trip-state]
say = "The code launches the confirming server, quotes orders O-2289 and O-1145, and gets the input request for the first. Then it retries five ways, each with a scripted yes. With one character of the sealed state changed: {{out:tampered-round-trip-state:one character changed}}. With no state at all: {{out:tampered-round-trip-state:answer without state}}. With the right state but the second quote's I D: {{out:tampered-round-trip-state:state with other arguments}}. Honestly: {{out:tampered-round-trip-state:honest retry}}. And the same honest retry once more, which passes the seal but meets the server's record of answered states: {{out:tampered-round-trip-state:same retry again}}"

[[tables]]
section = "elicitation-or-argument"
starts = "| What the tool needs |"
say = "A table of four things a tool may need, an example of each in the shop, and how to get it. A value in the ticket, such as the order I D a customer wrote, is a tool argument. A decision the policy gives a person, such as releasing a refund above the limit, is a form. A fact only the person present has, such as what a returned parcel held, is a form. A secret or a sign-in, such as the lead's payment provider account, goes through U R L mode."
