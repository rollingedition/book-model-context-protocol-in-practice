# Spoken descriptions for chapter 8, Authorize clients with OAuth: what each example does and what its output shows.

[examples.discover-the-authorization-server]
say = "The code starts the shop's authorization server, then serves chapter 3's tools behind OAuth, with the server's own address as its resource and orders read and stock read as the scopes every request needs. It sends a tools list request with no token and gets {{out:discover-the-authorization-server:status}}. The challenge names an error, a description and the resource metadata address, and the error is {{out:discover-the-authorization-server:challenge error}}. Following that address, the code reads the server's metadata. Its resource is the endpoint's own address, which the code checks; it lists {{out:discover-the-authorization-server:authorization servers}} authorization server, and its supported scopes are orders read and stock read. The authorization server's own metadata names the issuer it was fetched from, which the code also checks, and it offers only the S two fifty-six method for PKCE. The code also checks that the server advertises Client ID Metadata Documents and the issuer parameter on its answers."

[examples.publish-client-metadata]
say = "The code builds the support host's Client ID Metadata Document, whose client ID is its own address at support dot fernhill dot example, with one redirect address on localhost and no client secret. The authorization server's checks accept the document as published, and refuse a copy with a secret, a copy whose client ID names another site, and a client ID on plain HTTP. The SDK refuses a plain HTTP client ID too, with a value error. Then the SDK's client connects twice. Where the authorization server supports metadata documents, it sends the document's address as its client ID. Where it doesn't, the SDK falls back to Dynamic Client Registration without saying so, and fails with {{out:publish-client-metadata:without metadata document support}}."

[examples.token-with-pkce]
say = "The code connects the SDK's client to the protected server through a scripted browser and looks up order O-1873, which is {{out:token-with-pkce:O-1873 status}}. From the authorization server's log, it shows that the authorization request used the S two fifty-six method, and it asserts that the challenge is the hash of the verifier the token request revealed and that both requests named the server's own address as the resource. The token's audience is the server and its issuer the authorization server, its subject is {{out:token-with-pkce:token sub}}, its scope is orders read and stock read, and there is no refresh token. Then the code sends the same code a second time and gets {{out:token-with-pkce:code sent twice}}, sends a fresh code with a guessed verifier and gets {{out:token-with-pkce:wrong verifier}}, and asks for the plain method and gets an invalid request error saying that PKCE with S two fifty-six is required."

[examples.wrong-audience-rejected]
say = "The code signs two tokens with the shop's authorization server's key: one for the shop's server, and one for a partner's server at partner dot example. It presents both to the shop's server in three configurations. With the SDK's default, the partner's token gets {{out:wrong-audience-rejected:SDK default, partner's token}}, and the only sign is a warning, {{out:wrong-audience-rejected:SDK default, warnings}}. With validate token resource set to true, the partner's token gets {{out:wrong-audience-rejected:validate_token_resource=True, partner's token}}, and with the audience checked in the token verifier it gets {{out:wrong-audience-rejected:verifier checks aud, partner's token}}. The shop's own token gets {{out:wrong-audience-rejected:SDK default, own token}} in the SDK's default, {{out:wrong-audience-rejected:validate_token_resource=True, own token}} with validate token resource, and {{out:wrong-audience-rejected:verifier checks aud, own token}} with the verifier's check, and neither fix warns."

[examples.mix-up-attack-blocked]
say = "The code sets up a mix-up attack. A partner's server names the attacker's authorization server, which forwards the user's browser to the shop's authorization server with the host's own request, rewritten to ask for the shop's server and every scope. The user consents at the shop's authorization server both times. When the shop's authorization server sends the issuer parameter, the SDK stops with an authorization response issuer mismatch, and the attacker receives {{out:mix-up-attack-blocked:shop sends iss, codes the attacker received}} codes. When it omits the parameter, the SDK goes on and sends the code with its verifier to the attacker, which receives {{out:mix-up-attack-blocked:shop omits iss, codes the attacker received}} code, redeems it, and holds a token for the shop's server with orders read, stock read and refunds write. The host sees only a failed token exchange."

[examples.refund-needs-a-scope]
say = "The code signs a token with orders read and stock read and lists the shop's tools twice. With hiding off, all five tools are listed; with hiding on, issue refund is missing. Either way the list's cache scope is {{out:refund-needs-a-scope:tools/list cacheScope}}. Get order status answers {{out:refund-needs-a-scope:get_order_status}}. Issue refund answers {{out:refund-needs-a-scope:issue_refund}}, with an insufficient scope challenge that names refunds write and carries the resource metadata address. A refund call whose name header claims get order status is refused as a header mismatch, with {{out:refund-needs-a-scope:issue_refund named get_order_status in Mcp-Name}}. A refund whose name header is in Base64 gets {{out:refund-needs-a-scope:issue_refund with Mcp-Name in base64}}, and a refund from a client at the 2025 revision, which sends no name header, gets {{out:refund-needs-a-scope:issue_refund at 2025-11-25}}. A refund that sends the read-only token and then a second, junk authorization header gets {{out:refund-needs-a-scope:issue_refund with two Authorization headers}}, and a prompts get request, which no scope maps, gets {{out:refund-needs-a-scope:prompts/get, which no scope maps}}. With a token that carries refunds write, the call reaches the tool, which answers with {{out:refund-needs-a-scope:issue_refund with a lead token}}: the status, then a tool error, because the example's quote doesn't exist."

[examples.step-up-for-refunds]
say = "The code has two users refund order O-1004 through the SDK's client, a refund of {{out:step-up-for-refunds:lead, quote amount}} euros: a support lead, and a member of the support staff who may grant only the two read scopes. For the lead, the first authorization asks for orders read and stock read. The refund's 403 starts a second, which asks for those two plus refunds write, and the refund's status becomes {{out:step-up-for-refunds:lead, refund status}}. For the other user, the second authorization asks for the same three, the token comes back with only orders read and stock read, and the retried refund fails with a generic error from the server."
